# Release via EAS Workflows (macOS worker) — alternative to GitHub Actions.
# Requires (one-time):
#   - repo linked to the EAS project's GitHub integration (expo.dev dashboard)
#   - EAS env vars in the "production" environment:
#       GITHUB_TOKEN                        (repo-scoped PAT for creating releases)
#       MACOS_CERT_P12 / MACOS_CERT_PASSWORD (optional — Developer ID signing)
name: release
on:
  push:
    branches: [main]
jobs:
  release:
    name: Build + semantic-release
    type: custom
    runs_on: macos-medium
    image: latest
    environment: production
    steps:
      - uses: eas/checkout
      - name: Import signing certificate
        run: |
          if [ -n "${MACOS_CERT_P12:-}" ]; then
            echo "$MACOS_CERT_P12" | base64 -d > /tmp/cert.p12
            security create-keychain -p ci ci.keychain
            security default-keychain -s ci.keychain
            security unlock-keychain -p ci ci.keychain
            security set-keychain-settings -lut 21600 ci.keychain
            security import /tmp/cert.p12 -k ci.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
            rm /tmp/cert.p12
          else
            echo "No signing cert configured — artifact will be ad-hoc signed."
          fi
      - name: Semantic release
        run: |
          npm install --no-package-lock
          npx semantic-release
