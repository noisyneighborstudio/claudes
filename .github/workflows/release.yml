# semantic-release on every push to main: conventional commits drive the
# version (feat: minor, fix: patch, BREAKING CHANGE: major), release notes are
# generated, and Claudes.zip is built + attached to the GitHub release.
#
# Optional repo secrets (pipeline works without them; adds signing/notarization when present):
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD                - Developer ID Application cert
#   NOTARY_KEY_ID / NOTARY_KEY_ISSUER / NOTARY_KEY_P8   - App Store Connect API key
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        run: |
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Install release tooling
        run: npm install --no-package-lock
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
